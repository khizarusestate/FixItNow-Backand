name: Repair admin worker CNIC API

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch admin route
        run: |
          set -euo pipefail
          git checkout d63124be71b4a0b2c949d7ac3662738cfade89e1 -- routes/admin.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('routes/admin.js')
          s = p.read_text()
          old = '    verificationPhoto: data.verificationPhoto || null,\n'
          new = old + '    cnicFrontPhoto: data.cnicFrontPhoto || null,\n    cnicBackPhoto: data.cnicBackPhoto || null,\n'
          if 'cnicFrontPhoto: data.cnicFrontPhoto' not in s:
              if old not in s:
                  raise SystemExit('sanitizeWorker anchor not found')
              p.write_text(s.replace(old, new, 1))
          PY
          node --check routes/admin.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/repair-admin-cnic.yml
          rm -f .github/workflows/repair-admin-cnic.yml.disabled
          git add -- routes/admin.js .github/workflows/repair-admin-cnic.yml .github/workflows/repair-admin-cnic.yml.disabled
          git commit -m 'fix: restore admin route and expose worker CNIC docs'
          git push origin HEAD:main
