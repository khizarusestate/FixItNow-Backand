name: Patch worker CNIC documents

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch worker document upload flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('routes/auth.js')
          s = p.read_text()
          old = '''const verificationPhotoUpload = multer({
  storage: verificationPhotoStorage,
  limits: { fileSize: 2 * 1024 * 1024 },
  fileFilter: (req, file, cb) => {
    if (!file.mimetype.startsWith("image/")) {
      return cb(new Error("Verification photo must be an image."), false);
    }
    cb(null, true);
  },
});'''
          new = old + '''\n\nconst workerDocumentUpload = verificationPhotoUpload.fields([\n  { name: "verificationPhoto", maxCount: 1 },\n  { name: "cnicFrontPhoto", maxCount: 1 },\n  { name: "cnicBackPhoto", maxCount: 1 },\n]);'''
          assert old in s
          s = s.replace(old, new, 1)
          old = 'verificationPhotoUpload.single("verificationPhoto"),'
          assert old in s
          s = s.replace(old, 'workerDocumentUpload,', 1)
          old = '''    const {
      fullName,
      email: emailAddress,
      password,
      phoneNumber,
      cnicNumber,
    } = req.body;'''
          new = '''    const {
      fullName,
      email: emailAddress,
      password,
      phoneNumber,
      cnicNumber,
    } = req.body;

    const verificationFile = req.files?.verificationPhoto?.[0];
    const cnicFrontFile = req.files?.cnicFrontPhoto?.[0];
    const cnicBackFile = req.files?.cnicBackPhoto?.[0];'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    if (!req.file) {
      return res.status(400).json({
        success: false,
        message: "Passport-size verification photo is required.",
      });
    }'''
          new = '''    if (!verificationFile || !cnicFrontFile || !cnicBackFile) {
      return res.status(400).json({
        success: false,
        message: "Passport-size verification photo, CNIC front photo and CNIC back photo are required.",
      });
    }'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''      verificationPhoto: `/uploads/worker-verification/${req.file.filename}`,'''
          new = '''      verificationPhoto: `/uploads/worker-verification/${verificationFile.filename}`,
      cnicFrontPhoto: `/uploads/worker-verification/${cnicFrontFile.filename}`,
      cnicBackPhoto: `/uploads/worker-verification/${cnicBackFile.filename}`,'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    profilePicture: worker.profilePicture,
    devicePushEnabled:'''
          new = '''    profilePicture: worker.profilePicture,
    verificationPhoto: worker.verificationPhoto,
    cnicFrontPhoto: worker.cnicFrontPhoto,
    cnicBackPhoto: worker.cnicBackPhoto,
    devicePushEnabled:'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check routes/auth.js
      - name: Commit and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/patch-cnic-documents.yml
          git add routes/auth.js .github/workflows/patch-cnic-documents.yml
          git commit -m 'feat: support worker CNIC front and back uploads'
          git push
