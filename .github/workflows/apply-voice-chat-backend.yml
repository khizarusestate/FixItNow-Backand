name: Apply booking messenger backend upgrade
on:
  push:
    branches: [feature/booking-messenger-voice-chat]
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/booking-messenger-voice-chat' || github.ref_name == 'feature/booking-messenger-voice-chat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-messenger-voice-chat
          fetch-depth: 0
      - name: Apply patch
        run: node tools/apply-voice-chat-backend.mjs
      - name: Remove patch tooling
        run: rm -f tools/apply-voice-chat-backend.mjs .github/workflows/apply-voice-chat-backend.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Register booking-authorized voice call signaling"
          git push origin HEAD:feature/booking-messenger-voice-chat
