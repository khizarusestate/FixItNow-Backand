name: Recover auth and add worker CNIC uploads

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recover auth.js and apply CNIC upload changes
        shell: bash
        run: |
          set -euo pipefail
          PARENT=1d691ce4aefccfb41cc2109a2d3f0b0502257624
          git checkout "$PARENT" -- routes/auth.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('routes/auth.js')
          s = p.read_text()
          replacements = [
          ('''  filename: (req, file, cb) => {\n    cb(null, `verify-${generateSecureFilename(file.originalname, "worker")}`);\n  },''', '''  filename: (req, file, cb) => {\n    const prefixes = { verificationPhoto: "verify", cnicFrontPhoto: "cnic-front", cnicBackPhoto: "cnic-back" };\n    cb(null, `${prefixes[file.fieldname] || "worker-doc"}-${generateSecureFilename(file.originalname, "worker")}`);\n  },'''),
          ('''  limits: { fileSize: 2 * 1024 * 1024 },\n  fileFilter: (req, file, cb) => {\n    if (!file.mimetype.startsWith("image/")) {\n      return cb(new Error("Verification photo must be an image."), false);\n    }''', '''  limits: { fileSize: 2 * 1024 * 1024, files: 3 },\n  fileFilter: (req, file, cb) => {\n    if (!["verificationPhoto", "cnicFrontPhoto", "cnicBackPhoto"].includes(file.fieldname)) {\n      return cb(new Error("Unexpected worker document field."), false);\n    }\n    if (!file.mimetype.startsWith("image/")) {\n      return cb(new Error("Worker verification documents must be images."), false);\n    }'''),
          ('''    cnicNumber: worker.cnicNumber,\n    serviceCategory: worker.primaryServiceCategory,''', '''    cnicNumber: worker.cnicNumber,\n    cnicFrontPhoto: worker.cnicFrontPhoto || null,\n    cnicBackPhoto: worker.cnicBackPhoto || null,\n    verificationPhoto: worker.verificationPhoto || null,\n    serviceCategory: worker.primaryServiceCategory,'''),
          ('''  "/worker/register",\n  verificationPhotoUpload.single("verificationPhoto"),''', '''  "/worker/register",\n  verificationPhotoUpload.fields([\n    { name: "verificationPhoto", maxCount: 1 },\n    { name: "cnicFrontPhoto", maxCount: 1 },\n    { name: "cnicBackPhoto", maxCount: 1 },\n  ]),'''),
          ('''    // Verify photo required\n    if (!req.file) {\n      return res.status(400).json({\n        success: false,\n        message: "Passport-size verification photo is required.",\n      });\n    }''', '''    const verificationPhotoFile = req.files?.verificationPhoto?.[0];\n    const cnicFrontPhotoFile = req.files?.cnicFrontPhoto?.[0];\n    const cnicBackPhotoFile = req.files?.cnicBackPhoto?.[0];\n    if (!verificationPhotoFile || !cnicFrontPhotoFile || !cnicBackPhotoFile) {\n      for (const file of [verificationPhotoFile, cnicFrontPhotoFile, cnicBackPhotoFile]) {\n        if (file?.path && fs.existsSync(file.path)) fs.unlinkSync(file.path);\n      }\n      return res.status(400).json({ success: false, message: "Passport-size photo, CNIC front photo, and CNIC back photo are required." });\n    }'''),
          ('''      verificationPhoto: `/uploads/worker-verification/${req.file.filename}`,''', '''      verificationPhoto: `/uploads/worker-verification/${verificationPhotoFile.filename}`,\n      cnicFrontPhoto: `/uploads/worker-verification/${cnicFrontPhotoFile.filename}`,\n      cnicBackPhoto: `/uploads/worker-verification/${cnicBackPhotoFile.filename}`,''')]
          for old, new in replacements:
              if old not in s: raise SystemExit(f'pattern not found: {old[:60]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/recover-and-add-cnic.yml
          node --check routes/auth.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routes/auth.js .github/workflows/recover-and-add-cnic.yml
          git commit -m 'Add worker CNIC front and back uploads safely'
          git push origin main
