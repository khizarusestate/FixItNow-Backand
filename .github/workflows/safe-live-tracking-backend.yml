name: Safe live tracking backend

on:
  push:
    paths:
      - .github/workflows/safe-live-tracking-backend.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply backend tracking patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Patch pattern not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          replace(
              'utils/constants.js',
              "  WORKER_ASSIGNED: 'worker-assigned',\n  IN_PROGRESS",
              "  WORKER_ASSIGNED: 'worker-assigned',\n  ON_THE_WAY: 'on-the-way',\n  IN_PROGRESS",
          )
          replace(
              'bookingSchema.js',
              "        'worker-assigned',   // Admin approved claim, worker assigned\n        'in-progress',",
              "        'worker-assigned',   // Admin approved claim, worker assigned\n        'on-the-way',        // Worker has started travelling to the customer\n        'in-progress',",
          )
          replace(
              'bookingSchema.js',
              "    startedAt: {\n      type: Date,\n      default: null,\n      description: 'Set when worker clicks Go to Work (in-progress status)'\n    },",
              "    onTheWayAt: {\n      type: Date,\n      default: null,\n      description: 'Set when worker GPS tracking starts after assignment'\n    },\n    startedAt: {\n      type: Date,\n      default: null,\n      description: 'Set automatically when worker reaches the customer geofence'\n    },",
          )
          replace(
              'routes/liveTracking.js',
              '["assigned", "worker-assigned", "in-progress"]',
              '["assigned", "worker-assigned", "on-the-way", "in-progress"]',
          )

          p = Path('utils/socketManager.js')
          s = p.read_text()
          if 'const ARRIVAL_RADIUS_METERS = 100;' not in s:
              s = s.replace(
                  'import WorkerLiveLocation from "../models/WorkerLiveLocation.js";\n',
                  '''import WorkerLiveLocation from "../models/WorkerLiveLocation.js";\n\nconst ARRIVAL_RADIUS_METERS = 100;\nconst MAX_RELIABLE_ACCURACY_METERS = 100;\n\nfunction distanceMeters(lat1, lon1, lat2, lon2) {\n  const toRad = (value) => (value * Math.PI) / 180;\n  const earthRadius = 6371000;\n  const dLat = toRad(lat2 - lat1);\n  const dLon = toRad(lon2 - lon1);\n  const a =\n    Math.sin(dLat / 2) ** 2 +\n    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;\n  return 2 * earthRadius * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));\n}\n''',
                  1,
              )
          old = '''        const booking = await Booking.findOne({\n          _id: bookingId,\n          workerId: socket.userId,\n          status: { $in: ["assigned", "worker-assigned", "in-progress"] },\n          isDeleted: false,\n        })\n          .select("_id workerId customerId status")\n          .lean();'''
          new = '''        const booking = await Booking.findOne({\n          _id: bookingId,\n          workerId: socket.userId,\n          status: { $in: ["assigned", "worker-assigned", "on-the-way", "in-progress"] },\n          isDeleted: false,\n        })\n          .select("_id workerId customerId status latitude longitude serviceTitle")\n          .lean();'''
          if old not in s:
              raise SystemExit('socket booking query pattern not found')
          s=s.replace(old,new,1)
          old='''        const updatedAt = new Date();\n        await WorkerLiveLocation.findOneAndUpdate(\n          { bookingId: booking._id },'''
          new='''        const updatedAt = new Date();\n        let nextStatus = booking.status;\n        let statusChanged = false;\n        const destinationReady =\n          Number.isFinite(Number(booking.latitude)) &&\n          Number.isFinite(Number(booking.longitude));\n\n        if (nextStatus === "assigned" || nextStatus === "worker-assigned") {\n          nextStatus = "on-the-way";\n          statusChanged = true;\n        }\n\n        if (\n          nextStatus === "on-the-way" &&\n          destinationReady &&\n          (accuracy == null || accuracy <= MAX_RELIABLE_ACCURACY_METERS)\n        ) {\n          const distance = distanceMeters(\n            latitude,\n            longitude,\n            Number(booking.latitude),\n            Number(booking.longitude),\n          );\n          if (distance <= ARRIVAL_RADIUS_METERS) {\n            nextStatus = "in-progress";\n            statusChanged = true;\n          }\n        }\n\n        if (statusChanged) {\n          const statusUpdate = { status: nextStatus };\n          if (nextStatus === "on-the-way") statusUpdate.onTheWayAt = updatedAt;\n          if (nextStatus === "in-progress") statusUpdate.startedAt = updatedAt;\n          await Booking.updateOne(\n            { _id: booking._id, workerId: socket.userId, status: booking.status },\n            {\n              $set: statusUpdate,\n              $push: {\n                timeline: {\n                  status: nextStatus,\n                  timestamp: updatedAt,\n                  note:\n                    nextStatus === "on-the-way"\n                      ? "Worker started travelling to the customer."\n                      : "Worker reached the customer location and the job is now in progress.",\n                },\n              },\n            },\n          );\n        }\n\n        await WorkerLiveLocation.findOneAndUpdate(\n          { bookingId: booking._id },'''
          if old not in s:
              raise SystemExit('socket update insertion pattern not found')
          s=s.replace(old,new,1)
          old='''          status: booking.status,\n          updatedAt: updatedAt.toISOString(),\n        });'''
          new='''          status: nextStatus,\n          updatedAt: updatedAt.toISOString(),\n        });\n\n        if (statusChanged) {\n          emitToUser(booking.customerId, "booking-status-update", {\n            bookingId: String(booking._id),\n            serviceTitle: booking.serviceTitle,\n            status: nextStatus,\n            message:\n              nextStatus === "on-the-way"\n                ? "Your worker is on the way."\n                : "Your worker has arrived and the service is now in progress.",\n          });\n          emitToAdmin("refresh", {\n            type: "bookings",\n            timestamp: updatedAt.toISOString(),\n          });\n        }'''
          if old not in s:
              raise SystemExit('socket emit pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Install and verify backend
        run: npm ci
      - name: Commit verified backend patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add utils/constants.js bookingSchema.js routes/liveTracking.js utils/socketManager.js
          git diff --cached --quiet || git commit -m "Polish live tracking status transitions [skip ci]"
          git push
